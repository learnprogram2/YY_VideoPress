name: Build & Release

# Build the macOS and Windows apps in CI (real runners, no cross-compile pain).
# - Push a tag like v0.1.0  -> builds both and attaches them to a GitHub Release.
# - Manual run (Actions tab) -> builds both and uploads them as artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Add Go bin to PATH (unix)
        if: runner.os != 'Windows'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add Go bin to PATH (windows)
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
        shell: pwsh

      - name: Install NSIS (windows installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
        shell: pwsh

      - name: Package
        run: wails3 package

      - name: Zip .app (macOS)
        if: runner.os == 'macOS'
        run: |
          mv bin/xy-videopress.app "bin/小燕压缩.app"
          ditto -c -k --keepParent "bin/小燕压缩.app" "XY_VideoPress-${{ matrix.name }}.zip"

      - name: Collect installers (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem bin -Filter *.exe -Recurse | Copy-Item -Destination dist
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XY_VideoPress-${{ matrix.name }}
          path: |
            XY_VideoPress-*.zip
            dist/*.exe
          if-no-files-found: warn

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 小燕压缩 ${{ github.ref_name }}
          body: |
            ## 下载
            - **macOS (Apple Silicon)**：`XY_VideoPress-mac-arm64.zip`
            - **Windows (x64)**：下面的 `.exe`

            ## macOS 首次打开（未公证，需放行一次）
            下载解压后，首次打开会被系统拦住（“无法验证是否含恶意软件”），放行一次即可，二选一：
            1. **系统设置 → 隐私与安全性**，下拉找到 “xy-videopress 已被阻止” → 点 **仍要打开**。
            2. 或终端运行：`xattr -dr com.apple.quarantine /Applications/小燕压缩.app`（路径换成实际位置）。

            运行需本机安装 FFmpeg：macOS `brew install ffmpeg`，Windows `winget install ffmpeg`。
          files: |
            XY_VideoPress-*.zip
            dist/*.exe
